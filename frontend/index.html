<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="utf-8" />
    <!-- Tema: oscuro por defecto. Si el usuario eligió el claro, se cambia
         aquí, antes de pintar, para que no haya destello. Va en línea a
         propósito: un fichero aparte llegaría tarde. Ver styles.css. -->
    <script>
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.tema = tema;
        }
      } catch (e) {}
    </script>
    <title>Grupo Scout Nadino</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
